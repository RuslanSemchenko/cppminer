name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "23"

jobs:
  platform-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-clang23
            os: ubuntu-24.04
          - name: windows-x86_64-clang23
            os: windows-latest
          - name: macos-arm64-clang23
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ------------------------------------------------------------------
      # LLVM / Clang 23
      # ------------------------------------------------------------------
      - name: Install LLVM 23 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          codename="$(lsb_release -cs)"
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-${LLVM_VERSION}.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} \
            lld-${LLVM_VERSION} \
            llvm-${LLVM_VERSION} \
            libclang-rt-${LLVM_VERSION}-dev
          # NOTE: update-alternatives silently refuses to replace /usr/bin/clang
          # on GitHub runners (the file already exists and is not managed by
          # alternatives), so clang stayed at an old version.  Put LLVM's own
          # bin directory (it has unversioned clang/clang++/lld) first in PATH.
          test -x "/usr/lib/llvm-${LLVM_VERSION}/bin/clang"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 23 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@23
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"

      # clang-cl needs the MSVC/Windows SDK environment (INCLUDE, LIB, ...).
      # This step goes BEFORE the LLVM install so that our LLVM stays first in PATH.
      - name: Import MSVC environment on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = cmd /c "`"$bat`" >nul 2>&1 && set"
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]; $value = $Matches[2]
              if ($name -ieq 'Path') {
                foreach ($p in ($value -split ';')) {
                  if ($p) { Add-Content -Path $env:GITHUB_PATH -Value $p }
                }
              }
              elseif ($name -in @('INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir',
                                  'WindowsSdkDir', 'WindowsSdkVersion', 'UCRTVersion', 'UniversalCRTSdkDir',
                                  'VSINSTALLDIR', 'WindowsSDKLibVersion', 'WindowsSdkBinPath')) {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }
          }

      - name: Install LLVM 23 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\LLVM'

          # Newest stable LLVM 23.x release tag.
          $tag = gh api --paginate "repos/llvm/llvm-project/releases" `
            --jq '.[] | select(.prerelease == false and (.tag_name | startswith("llvmorg-23."))) | .tag_name' |
            Select-Object -First 1
          if (-not $tag) { throw 'No stable llvmorg-23.* release found on GitHub' }
          Write-Host "Using LLVM release $tag"
          Write-Host 'Windows assets in this release:'
          gh release view $tag --repo llvm/llvm-project --json assets --jq '.assets[].name' |
            Where-Object { $_ -match 'win' } | ForEach-Object { Write-Host "  $_" }

          function Test-Llvm {
            if (-not (Test-Path "$dest\bin\clang-cl.exe")) { return $false }
            $v = (& "$dest\bin\clang-cl.exe" --version | Select-Object -First 1)
            Write-Host "Installed: $v"
            return ($v -match 'version 23\.')
          }

          $ok = $false

          # 1) Prebuilt archive: extraction is synchronous, so there is no
          #    "installer returned early" race.
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          gh release download $tag --repo llvm/llvm-project `
            --pattern 'clang+llvm-*-x86_64-pc-windows-msvc.tar.xz' --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -eq 0) {
            $archive = Get-ChildItem $env:RUNNER_TEMP -Filter 'clang+llvm-*-x86_64-pc-windows-msvc.tar.xz' | Select-Object -First 1
            if ($archive) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              & "$env:SystemRoot\System32\tar.exe" -xf $archive.FullName -C $dest --strip-components=1
              if ($LASTEXITCODE -eq 0) { $ok = Test-Llvm }
            }
          }

          # 2) NSIS installer, waiting until the files really appear.
          if (-not $ok) {
            Write-Host 'Archive method failed, trying the installer'
            Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
            gh release download $tag --repo llvm/llvm-project `
              --pattern 'LLVM-*-win64.exe' --dir $env:RUNNER_TEMP --clobber
            if ($LASTEXITCODE -eq 0) {
              $exe = Get-ChildItem $env:RUNNER_TEMP -Filter 'LLVM-*-win64.exe' | Select-Object -First 1
              Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$dest" | Out-Null
              $deadline = (Get-Date).AddMinutes(10)
              while ((Get-Date) -lt $deadline) {
                Start-Sleep -Seconds 5
                $running = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'LLVM-*' }
                if (-not $running -and (Test-Path "$dest\bin\clang-cl.exe")) { break }
              }
              $ok = Test-Llvm
            }
          }

          if (-not $ok) { throw "Could not install LLVM 23 ($tag) into $dest" }

          # Our LLVM must win over the preinstalled C:\Program Files\LLVM (20.x).
          Add-Content -Path $env:GITHUB_PATH -Value "$dest\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "LLVM_ROOT=$dest"

      - name: Verify Clang version on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          which clang clang++
          clang --version
          clang++ --version
          major="$(clang++ --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -1)"
          test -n "$major" && test "$major" -ge 23

      - name: Verify Clang version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $clangCl = Join-Path $env:LLVM_ROOT 'bin\clang-cl.exe'
          Write-Host "clang-cl: $clangCl"
          & $clangCl --version
          $line = (& $clangCl --version | Select-Object -First 1)
          if ($line -notmatch 'version ([0-9]+)') { throw "Unable to determine Clang version" }
          if ([int]$Matches[1] -lt 23) { throw "Clang 23+ is required, found $line" }

      # ------------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libcurl4-openssl-dev libssl-dev nlohmann-json3-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install nlohmann-json openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix nlohmann-json):$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install curl nlohmann-json openssl --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------------
      - name: Configure Linux Clang build
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPPMINER_REQUIRE_CLANG=ON \
            -DCPPMINER_BUILD_FUZZING=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/staging"

      - name: Configure macOS Clang build
        if: runner.os == 'macOS'
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          sysroot="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sysroot"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPPMINER_REQUIRE_CLANG=ON \
            -DCPPMINER_BUILD_FUZZING=OFF \
            -DCMAKE_OSX_SYSROOT="$sysroot" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/staging"

      - name: Configure Windows Clang build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          # Use Clang's MSVC-compatible driver explicitly.  This keeps C, C++,
          # and ASM compilation on LLVM while remaining ABI-compatible with
          # the x64-windows libraries supplied by vcpkg.
          $clangCl = (Join-Path $env:LLVM_ROOT 'bin\clang-cl.exe') -replace '\\', '/'
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G Ninja `
            "-DCMAKE_C_COMPILER=$clangCl" `
            "-DCMAKE_CXX_COMPILER=$clangCl" `
            "-DCMAKE_ASM_COMPILER=$clangCl" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            '-DVCPKG_TARGET_TRIPLET=x64-windows' `
            '-DCMAKE_BUILD_TYPE=Release' `
            '-DCPPMINER_REQUIRE_CLANG=ON' `
            '-DCPPMINER_BUILD_FUZZING=OFF' `
            "-DCMAKE_INSTALL_PREFIX=$PWD/staging"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------------------------------------------------------
      # Build & test
      # ------------------------------------------------------------------
      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Run all algorithm self-tests and smoke benchmarks on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for algo in sha256d scrypt lyra2web randomx; do
            ./build/cppminer --benchmark -a "$algo" --bench-seconds=0.1 --randomx-light
          done

      - name: Run all algorithm self-tests and smoke benchmarks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          # The test binary is run from the build tree, before installation.
          # Make the dynamically linked vcpkg runtime dependencies discoverable.
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows\bin'
          $env:PATH = "$vcpkgBin$([IO.Path]::PathSeparator)$env:PATH"
          $algorithms = @('sha256d', 'scrypt', 'lyra2web', 'randomx')
          foreach ($algo in $algorithms) {
            .\build\cppminer.exe --benchmark -a $algo --bench-seconds=0.1 --randomx-light
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # ------------------------------------------------------------------
      # Package
      # ------------------------------------------------------------------
      - name: Install Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --install build
          cp LICENSE staging/
          install -m 0755 scripts/run-cppminer.sh staging/run-cppminer.sh

      - name: Bundle Unix runtime libraries
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/bundle-unix-runtime.sh "$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" staging

      - name: Install Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE staging/
          Copy-Item scripts\run-cppminer.cmd staging\
          New-Item -ItemType Directory -Force -Path staging\bin | Out-Null
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows\bin'
          Get-ChildItem $vcpkgBin -Filter *.dll -File | Copy-Item -Destination staging\bin -Force

      - name: Verify packaged Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: ./staging/run-cppminer.sh --benchmark -a sha256d --bench-seconds=0.1

      - name: Verify packaged Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\staging\run-cppminer.cmd --benchmark -a sha256d --bench-seconds=0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C staging -czf "cppminer-${{ matrix.name }}.tar.gz" .

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path staging\* -DestinationPath "cppminer-${{ matrix.name }}.zip"

      - name: Upload platform artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cppminer-${{ matrix.name }}
          path: cppminer-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14

  sanitizers-and-fuzzing:
    name: linux-clang23-asan-ubsan-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 23
        shell: bash
        run: |
          set -euo pipefail
          codename="$(lsb_release -cs)"
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-${LLVM_VERSION}.list > /dev/null
          sudo apt-get update
          # libclang-rt-*-dev provides the ASan/UBSan/libFuzzer runtimes.
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} \
            lld-${LLVM_VERSION} \
            llvm-${LLVM_VERSION} \
            libclang-rt-${LLVM_VERSION}-dev
          test -x "/usr/lib/llvm-${LLVM_VERSION}/bin/clang"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libcurl4-openssl-dev libssl-dev nlohmann-json3-dev

      - name: Verify Clang 23+
        shell: bash
        run: |
          set -euo pipefail
          which clang clang++
          clang++ --version
          major="$(clang++ --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -1)"
          test -n "$major" && test "$major" -ge 23

      - name: Configure sanitizer build
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPMINER_REQUIRE_CLANG=ON \
            -DCPPMINER_ENABLE_SANITIZERS=ON \
            -DCPPMINER_BUILD_FUZZING=OFF

      - name: Build sanitizer binary
        shell: bash
        run: cmake --build build-asan --parallel

      - name: Run sanitizer self-tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:symbolize=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          for algo in sha256d scrypt lyra2web randomx; do
            ./build-asan/cppminer --benchmark -a "$algo" --bench-seconds=0.1 --randomx-light
          done

      - name: Configure fuzz build
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPPMINER_REQUIRE_CLANG=ON \
            -DCPPMINER_BUILD_FUZZING=ON

      - name: Build fuzz targets
        shell: bash
        run: cmake --build build-fuzz --parallel

      - name: Run RandomX job parser fuzzing
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:symbolize=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build-fuzz/randomx_job_fuzz -max_total_time=600 -timeout=60 tests/fuzz/corpus

      - name: Run multi-algorithm fuzzing
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:symbolize=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build-fuzz/multi_algo_fuzz -max_total_time=600 -timeout=60 tests/fuzz/corpus

  release:
    name: publish-release-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: platform-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cppminer-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum cppminer-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "cppminer $GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/cppminer-* \
            release-assets/SHA256SUMS.txt